<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Lee's Treats Admin</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <img src="/static/lees_optimized.png" alt="Lee's Treats logo" style="height:32px; width:auto; border-radius:6px;">
      <h1>Lee's Treats Admin</h1>
    </div>
    <div class="header-right">
      <a href="/admin/" class="btn link">Dashboard</a>
      <a href="/admin/orders" class="btn">Orders</a>
      <a href="/admin/menu" class="btn primary">Menu</a>
      <a href="/" class="btn link">View Store</a>
      <button id="logoutBtn" class="btn link">Logout</button>
    </div>
  </header>

  <main>
    <div class="menu-head">
      <h2>Menu Items</h2>
      <button id="newItemBtn" class="btn primary">+ New Item</button>
    </div>
    <div id="adminItemsList"></div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <div id="itemModal" class="modal hidden">
    <div class="modal-content">
      <h3 id="itemModalTitle">New Item</h3>
      <form id="itemForm">
        <input type="hidden" id="f_id">
        <label>Name<input id="f_name" required></label>
        <label>Description<textarea id="f_description"></textarea></label>
        <label>Price<input id="f_price" type="number" step="0.01" min="0" required></label>
        <label>Category<input id="f_category" placeholder="e.g. Pizza"></label>
        <label>Image URL<input id="f_image" placeholder="https://..."></label>
        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/admin-menu.js"></script>
  <script>
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/admin/api/logout', { method: 'POST' });
      window.location.href = '/admin/login';
    });
  </script>
</body>
</html>
