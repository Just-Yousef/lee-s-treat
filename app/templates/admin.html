<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Lee's Treats Dashboard</title>
<link rel="stylesheet" href="/static/style.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/static/admin.css" media="print" onload="this.media='all'">
</head>
<body>
  <header>
    <h1>🍽️ Lee's Treats Admin</h1>
    <div class="header-right">
      <a href="/" class="btn link">View Store</a>
      <button id="themeToggle" class="btn link" onclick="toggleTheme()">🌓</button>
    </div>
  </header>

  <main class="admin-home">
    <h2>Dashboard</h2>
    <p class="subtitle">Choose what you'd like to manage.</p>
    <div class="admin-cards">
      <a href="/admin/orders" class="admin-card">
        <div class="card-icon">📦</div>
        <h3>Orders</h3>
        <p>View and update customer orders</p>
        <span class="go">Go to Orders →</span>
      </a>
      <a href="/admin/menu" class="admin-card">
        <div class="card-icon">🍕</div>
        <h3>Menu</h3>
        <p>Add, edit or delete food items</p>
        <span class="go">Go to Menu →</span>
      </a>
    </div>
  </main>
</body>
<script>
function toggleTheme() {
  const html = document.documentElement;
  const currentTheme = html.getAttribute('data-theme');
  const newTheme = currentTheme === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', newTheme);
  
  const toggleBtn = document.getElementById('themeToggle');
  toggleBtn.innerHTML = newTheme === 'light' ? '☀️' : '🌓';
  
  localStorage.setItem('theme', newTheme);
}

document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const theme = savedTheme || systemTheme;
  document.documentElement.setAttribute('data-theme', theme);
  
  const toggleBtn = document.getElementById('themeToggle');
  toggleBtn.innerHTML = theme === 'light' ? '☀️' : '🌓';
});
</script>
</html>
