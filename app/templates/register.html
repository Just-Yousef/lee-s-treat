<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Lee's Treats</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <img src="/static/lees_optimized.png" alt="Lee's Treats logo" class="logo">
    <h1>Lee's Treats</h1>
  </header>

  <nav id="main-nav" class="main-nav"></nav>

  <main class="auth-page">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="auth-subtitle">Join Lee's Treats for a better experience</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username"
                 minlength="3" maxlength="50" pattern="[a-zA-Z0-9_]+"
                 title="3-50 characters, letters, numbers, and underscores only">
          <small class="form-hint">3-50 characters, letters, numbers, and underscores only</small>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password"
                 minlength="8" maxlength="100">
          <small class="form-hint">At least 8 characters</small>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn primary btn-block">Create Account</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="/login.html">Sign in</a>
      </p>

      <p class="auth-switch">
        <a href="/" class="btn link">Continue as Guest</a>
      </p>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/auth.js"></script>
</body>
</html>
